<!DOCTYPE html>
<html>
<head>
    <title>Weighted Random Number Generator</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        #result { font-size: 3rem; font-weight: bold; color: #2c3e50; margin: 20px; }
        button { padding: 10px 25px; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Random Number (0 - 400)</h2>
    <div id="result">0.00</div> 
    
    <button onclick="
        let num;
        /* 70% chance to pick between 0-150, 30% chance for 150-400 */
        if (Math.random() < 0.7) {
            num = Math.random() * 150;
        } else {
            num = 150 + (Math.random() * 250);
        }
        document.getElementById('result').innerText = '₪' + num.toFixed(2);
    ">
        Random
    </button>

</body>
</html>
